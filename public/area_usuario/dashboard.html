<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papo do Subsolo - Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="icon" type="image/svg" href="../assets/imgs/determinacao.svg">
</head>

<body onload="validarSessao(), verificar_resultado()">
    <section id="barra_lateral">
        <div id="cima">
            <nav>
                <a id="a_logo" onclick="trocar_alma()">
                    <div id="logo_container"><img id="logo" src="../assets/imgs/determinacao.svg" alt=""></div>
                </a>
            </nav>
        </div>

        <div id="meio">
            <nav>
                <a class="desativo" href="home.html">
                    <img src="../assets/imgs/icon_home.svg" alt="">
                    <label>Home</label>
                </a>
                <a class="desativo" href="quiz.html">
                    <img src="../assets/imgs/icon_quiz.svg" alt="">
                    <label>Quiz</label>
                </a>
                <a class="ativo" href="dashboard.html">
                    <img src="../assets/imgs/icon_dashboard.svg" alt="">

                </a>
                <a class="desativo" href="forum.html">
                    <img src="../assets/imgs/icon_forum.svg" alt="">

            </nav>
        </div>

        <div id="baixo">
            <nav>
                <a onclick="finalizar_sessao()">
                    <img id="logout" src="../assets/imgs/icon_logout.svg" alt="">
                    <label>Logout</label>
                </a>
            </nav>
        </div>

    <section id="main">
        <main>
            <div id="locate">
                <label>PAPO DO SUBSOLO / DASHBOARD</label>
            </div>

            <div id="container_kpis">
                <div class="kpi">
                    <div>
                        <label class="titulo_kpi">Você se enche de</label>
                    </div>

                    <div>
                        <label class="principal" id="alma_kpi">DETERMINAÇÃO</label>
                    </div>

                    <div>
                        <label class="subtitulo_kpi">Esse é seu maior <span>valor!</span></label>
                    </div>
                </div>

                <div class="kpi">
                    <div>
                        <label class="titulo_kpi">YYYY é o</label>
                    </div>

                    <div>
                        <label class="principal" id="posi_personagem"><span>XX</span> / 48</label>
                    </div>

                    <div>
                        <label class="subtitulo_kpi">Persoangem <span>favorito</span> da galera!</label>
                    </div>
                </div>

                <div class="kpi">
                    <div class="titulo_kpi">
                        <label>Fãs de YYYY vibram com</label>
                    </div>

                    <div class="principal" id="almaP_kpi">
                        <label>JUSTIÇA</label>
                    </div>

                    <div class="subtitulo_kpi">
                        <label>Traço <span>predominante</span> a esse grupo</label>
                    </div>
                </div>
            </div>

            <div id="container_graficos">
                <div class="container_rankings">
                    <div class="ranking">

                    </div>

                    <div class="ranking">

                    </div>
                </div>

                <div class="container_pizza">
                    <div id="pizza">

                    </div>
                </div>
            </div>

    </section>


</body>

<script src="../js/sessao.js"></script>
