<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -8 150 224" width="450" height="672" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .p{fill:#fff}
    /* flexionar: todo o tronco sobe e desce 2px (ciclo de 1,6s) */
    .up{animation:upb 1.6s steps(1,end) infinite}
    @keyframes upb{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    /* cabeça: um segundo ritmo (ciclo de 2,4s) */
    .hd{animation:hdb 2.4s steps(1,end) infinite}
    @keyframes hdb{0%{transform:translateY(0)}40%{transform:translateY(-2px)}}
    /* juba ao vento (ciclo de 1,2s) */
    .mn{animation:mnb 1.2s steps(1,end) infinite}
    @keyframes mnb{0%{transform:translateY(0)}25%{transform:translateY(-2px)}50%{transform:translateY(0)}75%{transform:translateY(2px)}}
    /* laço da cauda (ciclo de 2s) */
    .lp{animation:lpb 2s steps(1,end) infinite}
    @keyframes lpb{0%{transform:translateY(0)}25%{transform:translateY(2px)}50%{transform:translateY(0)}75%{transform:translateY(-2px)}}
    /* ponta da cauda balança de lado (ciclo de 2s) */
    .tp{animation:tpb 2s steps(1,end) infinite;animation-delay:-.5s}
    @keyframes tpb{0%{transform:translateX(0)}25%{transform:translateX(2px)}50%{transform:translateX(0)}75%{transform:translateX(-2px)}}
    /* brilhos: cada um cresce em 3 tamanhos a cada 3s, em tempos diferentes */
    .a,.b,.c{visibility:hidden;animation:3s steps(1,end) infinite}
    .a{animation-name:sa}.b{animation-name:sb}.c{animation-name:sc}
    @keyframes sa{0%{visibility:hidden}12%{visibility:visible}20%{visibility:hidden}}
    @keyframes sb{0%{visibility:hidden}20%{visibility:visible}28%{visibility:hidden}}
    @keyframes sc{0%{visibility:hidden}28%{visibility:visible}36%{visibility:hidden}}
    .d1{animation-delay:0s}.d2{animation-delay:-1s}.d3{animation-delay:-2s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.a,.b,.c{visibility:hidden}}
  </style>
