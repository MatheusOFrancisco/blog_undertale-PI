<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 77 106" width="616" height="848" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .p{fill:#fff}
    /* ciclo total: 5s — fica parado balançando e leva um golpe no final */
    .hit-head{transform-origin:30px 30px;animation:hitHead 5s infinite}
    .hit-body{transform-origin:48px 78px;animation:hitBody 5s infinite}
    .hit-base{transform-origin:48px 100px;animation:hitBase 5s infinite}
    .idle-head{animation:idleHead 2.4s ease-in-out infinite}
    .idle-body{animation:idleBody 2.4s ease-in-out infinite;animation-delay:-.4s}

    @keyframes idleHead{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(0,-2px) rotate(-1.5deg)}}
    @keyframes idleBody{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-1px)}}

    @keyframes hitHead{
      0%,68%{transform:translate(0,0) rotate(0deg)}
      71%{transform:translate(-9px,3px) rotate(-14deg)}
      75%{transform:translate(5px,-2px) rotate(8deg)}
      79%{transform:translate(-4px,1px) rotate(-5deg)}
      83%{transform:translate(2px,0) rotate(3deg)}
      87%{transform:translate(-1px,0) rotate(-1deg)}
      92%,100%{transform:translate(0,0) rotate(0deg)}
    }
    @keyframes hitBody{
      0%,69%{transform:translate(0,0) rotate(0deg)}
      72%{transform:translate(4px,0) rotate(5deg)}
      76%{transform:translate(-3px,0) rotate(-3deg)}
      80%{transform:translate(2px,0) rotate(2deg)}
      85%{transform:translate(-1px,0) rotate(-1deg)}
      91%,100%{transform:translate(0,0) rotate(0deg)}
    }
    @keyframes hitBase{
      0%,69%{transform:translate(0,0)}
      72%{transform:translate(2px,0)}
      76%{transform:translate(-1px,0)}
      81%{transform:translate(1px,0)}
      86%,100%{transform:translate(0,0)}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- base -->
  <g class="hit-base"><path class="p" d="M49 86h2v2h-2zM45 88h6v2h-6zM43 90h8v6h-8zM33 96h18v2h-18zM53 96h10v2h-10zM29 98h38v2h-38zM31 100h34v2h-34z"/></g>
  <!-- corpo -->
  <g class="hit-body"><g class="idle-body"><path class="p" d="M51 36h4v2h-4zM49 38h6v2h-6zM43 40h14v2h-14zM39 42h18v4h-18zM37 46h22v4h-22zM35 50h26v4h-26zM33 54h30v2h-30zM33 56h26v2h-26zM61 56h2v2h-2zM31 58h2v2h-2zM39 58h6v2h-6zM47 58h8v2h-8zM63 58h2v2h-2zM31 60h8v2h-8zM55 60h4v2h-4zM61 60h6v2h-6zM29 62h16v2h-16zM47 62h20v2h-20zM27 64h42v4h-42zM25 68h46v8h-46zM27 76h42v2h-42zM33 78h30v2h-30z"/></g></g>
  <!-- cabeça -->
  <g class="hit-head"><g class="idle-head"><path class="p" d="M33 4h10v2h-10zM45 4h4v2h-4zM29 6h16v2h-16zM47 6h8v2h-8zM27 8h18v2h-18zM47 8h10v2h-10zM25 10h22v2h-22zM49 10h10v2h-10zM21 12h26v2h-26zM49 12h12v2h-12zM17 14h30v2h-30zM49 14h14v2h-14zM13 16h20v2h-20zM35 16h8v2h-8zM51 16h12v2h-12zM11 18h36v2h-36zM49 18h14v4h-14zM9 20h38v2h-38zM7 22h38v4h-38zM47 22h16v2h-16zM47 24h14v2h-14zM5 26h40v2h-40zM47 26h10v2h-10zM5 28h38v4h-38zM45 28h10v2h-10zM7 32h20v2h-20z"/></g></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
