<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 215" width="230" height="215" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Abre uma folga transparente no balão de trás, ao redor do balão da frente -->
    <mask id="folga-balao" maskUnits="userSpaceOnUse" x="0" y="0" width="230" height="215">
      <rect width="230" height="215" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="24" stroke-linejoin="round">
        <rect x="80" y="70" width="150" height="110" rx="30" ry="30"/>
        <polygon points="205,170 205,215 165,170"/>
      </g>
    </mask>
    <!-- Vaza os três pontinhos no balão da frente -->
    <mask id="pontos" maskUnits="userSpaceOnUse" x="0" y="0" width="230" height="215">
      <rect width="230" height="215" fill="#fff"/>
      <circle cx="125" cy="125" r="10" fill="#000"/>
      <circle cx="155" cy="125" r="10" fill="#000"/>
      <circle cx="185" cy="125" r="10" fill="#000"/>
    </mask>
  </defs>

  <!-- Balão de trás -->
  <g fill="#8389a0" mask="url(#folga-balao)">
    <rect x="0" y="0" width="150" height="110" rx="30" ry="30"/>
    <polygon points="25,100 25,145 65,100"/>
  </g>

  <!-- Balão da frente -->
  <g fill="#8389a0" mask="url(#pontos)">
    <rect x="80" y="70" width="150" height="110" rx="30" ry="30"/>
    <polygon points="205,170 205,215 165,170"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
