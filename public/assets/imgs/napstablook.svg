  <style>
    .p{fill:#fff}
    /* flutuar: sobe e desce 3px em degraus de 1px (ciclo de 2,4s) */
    .float{animation:float 2.4s steps(1,end) infinite}
    @keyframes float{
      0%{transform:translateY(0)}   12.5%{transform:translateY(-1px)}
      25%{transform:translateY(-2px)} 37.5%{transform:translateY(-3px)}
      50%{transform:translateY(-3px)} 62.5%{transform:translateY(-2px)}
      75%{transform:translateY(-1px)} 87.5%{transform:translateY(0)}
    }
    /* os 2 quadros do original (olhos mudam de 1 a 2 pixels), 0,6s cada */
    .a,.b{animation:swap 1.2s steps(1,end) infinite}
    .a{visibility:visible}
    .b{visibility:hidden;animation-name:swapb}
    @keyframes swap{0%{visibility:visible}50%{visibility:hidden}}
    @keyframes swapb{0%{visibility:hidden}50%{visibility:visible}}
    @media (prefers-reduced-motion:reduce){.float,.a,.b{animation:none}.b{visibility:hidden}}
  </style>
