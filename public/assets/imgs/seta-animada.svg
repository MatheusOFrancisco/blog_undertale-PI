<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 76" width="64" height="76" role="img" aria-label="Seta para baixo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .seta   { animation: pula 1.4s cubic-bezier(.45,0,.55,1) infinite; transform-box: fill-box; transform-origin: center; }
    .sombra { animation: sombra 1.4s cubic-bezier(.45,0,.55,1) infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pula {
      0%, 100% { transform: translateY(0);    opacity: 1; }
      50%      { transform: translateY(14px); opacity: .75; }
    }
    @keyframes sombra {
      0%, 100% { transform: scale(1);   opacity: .35; }
      50%      { transform: scale(.6);  opacity: .15; }
    }
    @media (prefers-reduced-motion: reduce) {
      .seta, .sombra { animation: none; }
    }
  </style>
  <ellipse class="sombra" cx="32" cy="70" rx="14" ry="3" fill="#000"/>
  <polygon class="seta" points="8,8 56,8 32,48" fill="#ffe94a"/>
</svg>
