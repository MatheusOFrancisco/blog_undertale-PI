<script src="js/padroes.js"></script>
<script src="js/chuva.js"></script>
<script>
  function mostrar_senha() {
    let tipo_input = ipt_senha.type

    if (tipo_input == 'password') {
      mostrar.innerHTML = '◎'
      ipt_senha.type = 'text'
      ipt_confirmacao_senha.type = 'text'
    } else {
      mostrar.innerHTML = '◉'
      ipt_senha.type = 'password'
      ipt_confirmacao_senha.type = 'password'
    }
  }

  // VALIDAÇÔES DOS CAMPOS
  email_valido = false
  nome_valido = false
  senha_valida = false
  confirmacao_valida = false

  function verificar_nome() {
    let nome = ipt_nome.value

    if (nome.length >= 5) {
      msg_validacoes.innerHTML = `<div id="msg"></div>`
      nome_valido = true
    } else {
      msg_validacoes.innerHTML = `<div id="msg">O nome deve ter pelo menos 5 caracteres.</div>`
      nome_valido = false
    }
  }

  function verificar_email() {
    let email = ipt_email.value

    if (email.includes('@') && email.includes('.')) {
      msg_validacoes.innerHTML = `<div id="msg"></div>`
      email_valido = true
    } else {
      msg_validacoes.innerHTML = `<div id="msg">O email deve conter "@" e ".".</div>`
      email_valido = false
    }
  }

  function verificar_senha() {
    let senha = ipt_senha.value

    let tem_tamanho = false
    let tem_minuscula = false
    let tem_maiuscula = false
    let tem_numero = false
    let tem_simbolo = false

    if (senha.includes(' ')) {
      senha_valida = false
      msg_validacoes.innerHTML = `<div id="msg">A senha não pode conter espaço.</div>`
    } else {
      msg_validacoes.innerHTML = `<div id="msg"></div>`

      let digitado = ''

      for (let i = 0; i < senha.length; i++) {
        digitado = senha[i]

        if (digitado >= 'a' && digitado <= 'z') {
          tem_minuscula = true
        } else if (digitado >= 'A' && digitado <= 'Z') {
          tem_maiuscula = true
        } else if (digitado >= '0' && digitado <= '9') {
          tem_numero = true
        } else if (digitado) {
          tem_simbolo = true
        }

        if (senha.length >= 8) {
          tem_tamanho = true
        }
      }

      let pontos = 0

      if (tem_tamanho == true) {
        tamanho.className = "verde"
        img_tamanho.innerHTML = `<img class="coracao" src="assets/imgs/coracao_cheio.svg" alt="">`
        pontos++
      } else {
        tamanho.className = "vermelho"
        img_tamanho.innerHTML = `<img class="coracao" src="assets/imgs/coracao_vazio.svg" alt="">`
      }

      if (tem_minuscula == true && tem_maiuscula == true) {
        tipos_letras.className = "verde"
        img_tipos_letras.innerHTML = `<img class="coracao" src="assets/imgs/coracao_cheio.svg" alt="">`
        pontos++
      } else {
        tipos_letras.className = "vermelho"
        img_tipos_letras.innerHTML = `<img class="coracao" src="assets/imgs/coracao_vazio.svg" alt="">`
      }

      if (tem_numero == true) {
        numero.className = "verde"
        img_numero.innerHTML = `<img class="coracao" src="assets/imgs/coracao_cheio.svg" alt="">`
        pontos++
      } else {
        numero.className = "vermelho"
        img_numero.innerHTML = `<img class="coracao" src="assets/imgs/coracao_vazio.svg" alt="">`
      }

      if (tem_simbolo == true) {
        caractere.className = "verde"
        img_caractere.innerHTML = `<img class="coracao" src="assets/imgs/coracao_cheio.svg" alt="">`
        pontos++
      } else {
        caractere.className = "vermelho"
        img_caractere.innerHTML = `<img class="coracao" src="assets/imgs/coracao_vazio.svg" alt="">`
      }

      if (pontos == 4) {
        senha_valida = true
      } else {
        senha_valida = false
      }
    }
  }

  function verificar_confirmacao() {
    let senha = ipt_senha.value
    let confirmacao = ipt_confirmacao_senha.value

    if (senha === confirmacao) {
      msg_validacoes.innerHTML = `<div id="msg"></div>`
      confirmacao_valida = true
    } else {
      msg_validacoes.innerHTML = `<div id="msg">Ambas as senhas devem ser iguais.</div>`
      confirmacao_valida = false
    }
  }

  // REALIZAR CADASTRO

  // Array para armazenar emails cadastrados para evitar repetição 
  // let lista_emails_cadastrados = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nome = ipt_nome.value;
    var email = ipt_email.value;
    var senha = ipt_senha.value;
    var confirmacaoSenha = ipt_confirmacao_senha.value;

    // Verificando se há algum campo invalidado
    if (senha_valida == false) {
      msg_validacoes.innerHTML = '<div id="msg">A senha deve atender todos os requisitos.</div>';
    } else if (nome_valido == false) {
      msg_validacoes.innerHTML = '<div id="msg">O nome deve ter pelo menos 5 caracteres.</div>';
    } else if (email_valido == false) {
      msg_validacoes.innerHTML = '<div id="msg">O email deve conter "@" e ".".</div>';
    } else if (confirmacao_valida == false) {
      msg_validacoes.innerHTML = '<div id="msg">Ambas as senhas devem ser iguais.</div>';
    } else {

      // Verificando se o email já está vinculado a outra conta
      // for (let i = 0; i < lista_emails_cadastrados.length; i++) {
      //   if (lista_emails_cadastrados[i].email == email) {
      //     msg_validacoes.innerHTML = '<div id="msg">Email já vinculado a outra conta!</div>';
      //   }
      // }

      // Enviando o valor da nova input
      fetch("usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          // crie um atributo que recebe o valor recuperado aqui
          // Agora vá para o arquivo routes/usuario.js
          nomeServer: nome,
          emailServer: email,
          senhaServer: senha
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {
            msg_validacoes.innerHTML = '<div id="msg">Cadastro realizado com sucesso! Redirecionando para tela de Login...</div>';

            setTimeout(() => {
              window.location = "login.html";
            }, "2000");
          } else {
            throw msg_validacoes.innerHTML = '<div id="msg">Houve um erro ao tentar realizar o cadastro!</div>';
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
        });

      return false;
    }
  }

  // Listando emails cadastrados 
  function listar() {
    fetch("/emails/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((emails) => {
          emails.forEach((email) => {
            lista_emails_cadastrados.push(email);

            console.log("lista_emails_cadastrados")
            console.log(lista_emails_cadastrados[0].email)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }
</script>
