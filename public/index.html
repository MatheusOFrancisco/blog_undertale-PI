<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papo do Subsolo - Início</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg" href="assets/imgs/determinacao.svg">
</head>
<body>
  <header>
    <div style="width: 32rem;" class="container_principal">
      <div>
        <img src="assets/imgs/determinacao.svg" alt="determinação">
      </div>

      <nav class="lista_texto">
        <a href="">Menu</a>
        <a href="">História</a>
        <a href="">Personagens</a>
        <a href="">Quiz</a>
        <a href="">Discussões</a>
      </nav>
    </div>

    <div style="width: 20rem;" class="container_principal">
      <div>
        <a id="link_audio" class="link_header" onclick="desmutar_musica()"><img src="assets/imgs/alto_falante_sem_som.svg" alt=""></a>
      </div>

      <div class="container_usuario">
          <a>
            login
          </a>

          <a>
            cadastro
          </a>

          <img src="assets/imgs/save_amarelo.svg" alt="">
      </div>
    </div>
  </header>

  <section class="section_home" id="home">
    <div class="container_principal">
      <div style="align-self: flex-end; transform: scale(0.65); transform-origin: right;">
        <img src="assets/imgs/logo_undertale.svg" alt="">
        <div>A queda para um novo mundo</div>
      </div>

      <div style="align-self: center; transform: scale(0.75); transform-origin: center;">
        <a href="#historia"><img src="assets/imgs/seta-animada.svg" alt=""></a>
      </div>
    </div>
  </section>

  <section class="section_historia" id="historia">
    <div>
      <img src="assets/imgs/mont_ebbot.svg" alt="">
    </div>
  </section>

  <footer>

  </footer>

  <audio id="audio_pagina" autoplay loop muted><source src="assets/music/Once_Upon_a_Time.flac" type="audio/flac"></audio>
  
</body>
<script>
  function desmutar_musica() {
    let audio = document.getElementById("audio_pagina");

    if (audio.muted) {
      audio.muted = false;
      audio.play();
      link_audio.innerHTML = '<img src="assets/imgs/alto_falante_com_som.svg" alt="">'
    } else {
      audio.muted = true;
      link_audio.innerHTML = '<img src="assets/imgs/alto_falante_sem_som.svg" alt="">'
    }
  }
</script>
</html>
