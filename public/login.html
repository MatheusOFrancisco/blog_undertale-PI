  <!--footer fim-->

  <audio id="audio_pagina" loop muted>

  </audio>

  <canvas id="chuva"></canvas>

<script src="js/padroes.js"></script>
<script src="js/chuva.js"></script>
<script>
  function mostrar_senha() {
    let tipo_input = ipt_senha.type

    if (tipo_input == 'password') {
      mostrar.innerHTML = '◎'
      ipt_senha.type = 'text'
      ipt_confirmacao_senha.type = 'text'
    } else {
      mostrar.innerHTML = '◉'
      ipt_senha.type = 'password'
      ipt_confirmacao_senha.type = 'password'
    }
  }

  function entrar() {
    var emailVar = ipt_email.value;
    var senhaVar = ipt_senha.value;

    if (emailVar == "" || senhaVar == "") {
      msg_validacoes.innerHTML = `<div id="msg">Para fazer login é necessário preencher os campos.</div>`
    } else {
      fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          emailServer: emailVar,
          senhaServer: senhaVar
        })
      }).then(function (resposta) {

        if (resposta.ok) {
          resposta.json().then(json => {
            sessionStorage.EMAIL_USUARIO = json.email;
            sessionStorage.NOME_USUARIO = json.nome;
            sessionStorage.ID_USUARIO = json.id;

            setTimeout(function () {
              window.location = "./area_usuario/home.html";
            }, 1000); // apenas para exibir o loading

          });

        } else {

          console.log("Houve um erro ao tentar realizar o login!");

          resposta.text().then(texto => {
            console.error(texto);
          });
        }

      }).catch(function (erro) {
        console.log(erro);
      })

      return false;
    }
  }
</script>
